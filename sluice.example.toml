# Sluice configuration. Copy to sluice.toml and edit.
#
# v0 proxies exactly one downstream server. The [servers.<name>] table shape
# admits several because tool namespacing is built for fan-out, but Sluice
# refuses to start with more than one configured rather than pretending.

[servers.gh]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-github"]
# ${VAR} expands from Sluice's own environment, so secrets stay out of this file.
env = { GITHUB_TOKEN = "${GITHUB_TOKEN}" }

# Optional: approve automatic page fetching for one downstream tool that follows
# the offset contract (limit/offset in, items/has_more/next_offset out). The tool
# must be annotated readOnlyHint=true downstream. See spec/002-bounded-pagination.md.
# [pagination.list_issues]
# page_size = 100
# max_pages = 100
# max_bytes = 8388608
# max_seconds = 120

[limits]
# A ceiling applied before parsing, not a size gate on interception: everything
# under it is still materialized. See spec 5.1 for what it does and does not bound.
max_payload_bytes = 1048576
max_concurrent_materializations = 2
# Logical bytes retained by payloads and materialized table rows in this
# process. Old calls are evicted deterministically when the budget is full.
max_session_bytes = 268435456
# Metadata rows and scope views are capped separately from payload/table bytes.
max_session_calls = 1000
preview_bytes = 2048
preview_rows = 3
max_columns = 64
query_timeout_seconds = 10
query_max_rows = 100
query_max_bytes = 65536
max_cell_bytes = 512
duckdb_max_memory = "1GB"
