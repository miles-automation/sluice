name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install current dependencies
        run: uv sync --upgrade

      - name: Verify tag matches package version
        run: |
          test "${GITHUB_REF_NAME#v}" = "$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "${GITHUB_REF_NAME#v}" = "$(uv run python -c 'import sluice; print(sluice.__version__)')"

      - name: Run release checks
        run: |
          uv run pytest
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src tests

      - name: Build distributions
        run: uv build

      - name: Verify distribution metadata
        run: |
          test -f "dist/mcp_sluice-${GITHUB_REF_NAME#v}.tar.gz"
          test -f "dist/mcp_sluice-${GITHUB_REF_NAME#v}-py3-none-any.whl"
          uvx twine check dist/*
          unzip -p dist/*.whl 'mcp_sluice-*.dist-info/METADATA' | grep -Fx 'Name: mcp-sluice'
          unzip -p dist/*.whl 'mcp_sluice-*.dist-info/METADATA' | grep -Fx 'License-Expression: Apache-2.0'
          unzip -l dist/*.whl | grep -F 'licenses/LICENSE'

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: mcp-sluice-dist
          path: dist/
          if-no-files-found: error

  github-release:
    needs:
      - build
      - pypi-publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: mcp-sluice-dist
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"

  pypi-publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: mcp-sluice-dist
          path: dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
