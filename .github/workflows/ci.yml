name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      # Dependencies deliberately have lower bounds rather than a committed
      # lock file. The engine contract tests make CI the forward-compatibility
      # tripwire for new MCP and DuckDB releases.
      - name: Install current dependencies
        run: uv sync --upgrade

      - name: Run tests
        run: uv run pytest

      - name: Run lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run type checks
        run: uv run mypy src tests

      - name: Build distributions
        run: uv build

      - name: Smoke-test wheel
        run: |
          uv venv --python 3.14 /tmp/sluice-wheel-smoke
          uv pip install --python /tmp/sluice-wheel-smoke/bin/python dist/*.whl
          /tmp/sluice-wheel-smoke/bin/python -c 'import importlib.metadata, importlib.resources, sluice; assert importlib.metadata.version("mcp-sluice") == sluice.__version__; assert importlib.resources.files("sluice").joinpath("py.typed").is_file()'
          /tmp/sluice-wheel-smoke/bin/sluice --help

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: mcp-sluice-dist
          path: dist/
          if-no-files-found: error

  platform-smoke:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Download wheel
        uses: actions/download-artifact@v8
        with:
          name: mcp-sluice-dist
          path: dist

      - name: Install wheel
        run: >-
          python -c "import glob, subprocess, sys;
          wheels = glob.glob('dist/*.whl');
          assert len(wheels) == 1, wheels;
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', wheels[0]])"

      - name: Smoke-test installed package
        run: |
          python -c "import importlib.metadata, importlib.resources, sluice; assert importlib.metadata.version('mcp-sluice') == sluice.__version__; assert importlib.resources.files('sluice').joinpath('py.typed').is_file()"
          python -m sluice --help
